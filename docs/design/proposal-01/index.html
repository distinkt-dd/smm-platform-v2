function nav(){return [['workspace','chat','Задачи'],['themes','themes','Мои темы'],['profile','user','Профиль']].map(([p,i,t])=>`<a class="navlink ${page===p?'active':''}" href="?page=${p}" ${page===p?'aria-current="page"':''}>${icon(i)}${t}</a>`).join('')}
function shell(content,title){return `<div class="shell"><aside class="sidebar">${brand}<a class="btn newtask" href="?page=workspace">${icon('plus')}Новая задача</a><nav aria-label="Главная навигация">${nav()}</nav><div class="recent"><p>Недавние задачи</p><a href="?page=workspace">Знакомство с мастером</a><a href="?page=workspace&stage=result">Уход после процедуры</a><a href="?page=workspace">Свободные окошки</a></div><a class="user" href="?page=profile"><span class="avatar">АК</span><span><b class="small">Анна Ковалёва</b><br><span class="small muted">Мой профиль</span></span></a></aside><main class="main"><header class="mobilehead">${brand}<a href="?page=profile" class="avatar" aria-label="Мой профиль">АК</a></header><header class="topbar"><div class="crumb">${title}</div><a class="help" href="?page=login">Выйти ${icon('user')}</a></header>${content}</main><nav class="bottomnav" aria-label="Главная навигация">${nav()}</nav></div>`}
function auth(register){return `<main class="auth ${register?'register':''}"><aside class="authaside">${brand}<div class="pitch"><h1>Ваше дело.<br>Ваш голос.<br>Ваш контент.</h1><p>От идеи до готовой сторис —<br>в одном спокойном диалоге.</p><div class="miniwork"><div class="ministory">Бережно<br>к себе.<small style="font:8px 'Segoe UI'">Уход за кожей</small></div><div class="ministory">Время<br>для себя.<small style="font:8px 'Segoe UI'">Запись открыта</small></div><p>Оформление под ваш стиль, а не наоборот.</p></div></div><p class="authfoot">Создано для самостоятельных бьюти-мастеров</p></aside><section class="authmain">${brand}<form class="authform" onsubmit="event.preventDefault();toast('Это макет. Данные никуда не отправлены.')"><h1>${register?'Давайте знакомиться':'С возвращением'}</h1><p>${register?'Создайте аккаунт для своей практики.':'Продолжим создавать ваш контент.'}</p>${register?'<label class="field">Как вас зовут<input autocomplete="name" placeholder="Анна Ковалёва" required></label>':''}<label class="field">Электронная почта<input type="email" autocomplete="email" placeholder="anna@example.ru" required></label><label class="field"><span class="passwordlabel">Пароль${!register?'<button type="button" class="textlink small" onclick="toast(\'Восстановление пароля — следующий экран авторизации\')">Забыли пароль?</button>':''}</span><input type="password" autocomplete="${register?'new-password':'current-password'}" placeholder="${register?'Не менее 8 символов':'Введите пароль'}" minlength="8" required></label><button class="btn" type="submit">${register?'Создать аккаунт':'Войти'}</button>${register?'<p class="legal muted">Регистрируясь, вы принимаете условия сервиса и политику конфиденциальности.</p>':''}<p class="authswitch">${register?'Уже есть аккаунт?':'Впервые здесь?'} <a class="textlink" href="?page=${register?'login':'register'}">${register?'Войти':'Зарегистрироваться'}</a></p></form></section></main>`}
function story(){return `<div class="story"><small>АННА КОВАЛЁВА</small><h2>Бережно<br>к себе.<br>Каждый день.</h2><div class="petal"></div><div class="storyfooter"><span>Простой уход<br>после процедуры</span><b>Листайте дальше</b></div></div>`}
function workspace(){return shell(`<div class="mobtabs"><button class="selected" data-tab="chat" onclick="tab(false)">Диалог</button><button data-tab="preview" onclick="tab(true)">Превью${result?' · 3':''}</button></div><div class="workspace"><section class="chat" aria-label="Диалог задачи"><p class="date">Сегодня, 10:24</p><div class="usermsg">Сделаем три сторис об уходе после процедуры. Спокойно, без сложных терминов. В моей теме «Тихая ботаника».<div class="attachments"><div class="file"><span>Фото 1</span></div><div class="file"><span>Фото 2</span></div><div class="file"><span>Фото 3</span></div></div></div><div class="assistant"><div class="assistantlabel"><i class="mark"></i>SMM в кармане</div><p>${result?'Серия готова. Посмотрите все три сторис. Можно изменить текст или оформление прямо здесь.':'Предлагаю короткую серию. Сначала согласуем содержание, затем я оформлю сторис.'}</p>${result?`<div class="resultmessage"><div class="resultthumbs"><div class="tiny">Бережно<br>к себе.</div><div class="tiny">Ваш<br>ежедневный<br>уход.</div><div class="tiny">Остались<br>вопросы?</div></div><div class="statusline">${icon('check')}3 сторис готовы к просмотру</div><div class="resulttools"><button class="btn orange approval" onclick="approve()">Одобрить результат</button><button class="btn outline editresult" onclick="editResult()">Внести правки</button></div><p class="editnote">После одобрения тема обновится автоматически.<br>Предыдущая версия сохранится.</p><div class="publishbox" id="publication"></div></div>`:`<div class="plan"><div class="planhead"><b>План серии</b><span class="small muted">3 сторис · 9:16</span></div><div class="planbody"><div class="scene"><span>1</span><div><h3>Бережно к себе</h3><p>Обложка с вашей фотографией и темой ухода.</p></div></div><div class="scene"><span>2</span><div><h3>Ежедневный уход</h3><p>Короткие рекомендации из ваших материалов.</p></div></div><div class="scene"><span>3</span><div><h3>Остались вопросы?</h3><p>Предложение написать мастеру лично.</p></div></div></div><div class="planfoot"><a class="btn orange" href="?page=workspace&stage=result">Согласовать и создать</a><button class="small" onclick="document.querySelector('textarea').focus()">Изменить план</button></div></div>`}</div><div class="composer"><form class="inputbox" onsubmit="event.preventDefault();toast('Сообщение показано только в макете')"><textarea aria-label="Сообщение" placeholder="${result?'Что хотите изменить?':'Уточните план или добавьте материалы…'}"></textarea><div class="inputtools"><button type="button" aria-label="Прикрепить материалы" onclick="toast('В макете загрузка материалов не подключена')">${icon('attach')}</button><button class="pill" type="button" onclick="location.href='?page=themes'">${icon('leaf')}Тихая ботаника</button><button class="send" type="submit" aria-label="Отправить">${icon('up')}</button></div></form><p>Проверьте факты и рекомендации перед одобрением.</p></div></section><aside class="preview"><div class="previewhead"><b>${result?'Готовый результат':'Тема оформления'}</b><span class="small muted">${result?'1 из 3':'9:16'}</span></div>${story()}${result?'<div class="strip"><button class="selected" onclick="selectSlide(this,0)">1</button><button onclick="selectSlide(this,1)">2</button><button onclick="selectSlide(this,2)">3</button></div>':''}<p class="caption">${result?'Серия сторис · Тихая ботаника':'Тихая ботаника · версия 3'}<br>${result?'Ещё не опубликовано':'Пример оформления. Новый контент появится после согласования плана.'}</p>${result?'<button class="btn outline" onclick="toast(\'Экспорт появится в рабочем приложении\')">Скачать серию</button>':''}</aside></div>`,`<span>Задачи</span><span class="muted">/</span><b>Уход после процедуры</b>`)}
function themes(){return shell(`<section class="page"><div class="pagelead"><div><h1>Мои темы</h1><p class="muted">Ваш стиль, к которому можно вернуться.</p></div></div><div class="tabs"><button class="selected" onclick="filterThemes(this,false)">Все темы <span class="muted">3</span></button><button onclick="filterThemes(this,true)">Недавние</button></div><div class="themegrid">${[['','Тихая ботаника','Бережно<br>к себе.','Версия 3 · сегодня'],['rose','Пудровый','Время<br>для себя.','Версия 2 · 28 октября'],['graphic','Чёткий акцент','Красота<br>в деталях.','Версия 1 · 24 октября']].map(([c,n,t,v])=>`<article><a href="?page=workspace" aria-label="Использовать тему ${n}"><div class="themeart ${c}"><small>АННА КОВАЛЁВА</small><h2>${t}</h2><div class="shape"></div></div></a><div class="themetitle"><h3>${n}</h3><button aria-label="Версии темы ${n}" onclick="toast('Предложение: история версий с просмотром и возвратом')">${icon('more')}</button></div><p class="themeinfo">${v}</p><a class="small textlink" style="display:inline-block;margin-top:10px" href="?page=workspace">Использовать тему</a></article>`).join('')}</div><div class="librarynote">${icon('leaf')}<p>Темы сохраняются после одобрения готовой работы. Меняя оформление, вы обновляете тему и сохраняете возможность вернуться к прошлой версии.</p></div></section>`,'Мои темы')}
function profile(){return shell(`<section class="page"><div class="pagelead"><div><h1>Мой профиль</h1><p class="muted">Помогает создавать контент о вас и вашем деле.</p></div></div><div class="profilelayout"><form onsubmit="event.preventDefault();toast('Макет: изменения не сохраняются')"><div class="profileintro"><div class="avatar">АК</div><div><h3>Анна Ковалёва</h3><p class="small muted">Ваш личный аккаунт</p></div></div><h3 style="margin-bottom:20px">О вас</h3><label class="field">Имя<input value="Анна Ковалёва" autocomplete="name"></label><label class="field">Электронная почта<input type="email" value="anna@example.ru" autocomplete="email"></label><h3 class="sectiontitle">Ваша практика</h3><div class="fieldrow"><label class="field">Направление<select><option>Косметология</option><option>Ногтевой сервис</option><option>Уход за волосами</option><option>Брови и ресницы</option><option>Другое</option></select></label><label class="field">Город<input value="Екатеринбург" autocomplete="address-level2"></label></div><label class="field">О вашей работе<textarea>Помогаю выстроить понятный домашний уход. Люблю естественный результат и бережный подход.</textarea></label><p class="small muted">Указывайте только те сведения, которые можно использовать в вашем контенте.</p><div class="savebar"><button class="btn" type="submit">Сохранить изменения</button><span class="small muted">Доступно только вам</span></div><section class="socialsection" aria-labelledby="socialtitle"><h3 id="socialtitle">Соцсети</h3><p class="small muted">Подключите свои страницы один раз. Готовые сторис можно будет отправлять отсюда.</p><div id="socialaccounts"></div></section></form><aside class="profileaside"><i class="mark"></i><h3>Чуть больше о вас.<br>Точнее каждый текст.</h3><p>Профиль помогает учитывать ваше направление, город и подход к работе.</p><p style="margin-top:16px">Цвета, шрифты и оформление хранятся отдельно — в ваших темах.</p><a class="textlink" style="display:block;margin-top:18px" href="?page=themes">Перейти к темам</a></aside></div></section>`,'Мой профиль')}
function tab(preview){document.querySelector('.workspace').classList.toggle('showpreview',preview);document.querySelectorAll('.mobtabs button').forEach((b,i)=>b.classList.toggle('selected',i===Number(preview)))}
function approve(){approved=true;publicationError=false;renderPublication();if(innerWidth<=760){tab(false);document.getElementById('publication')?.scrollIntoView({block:'center'})}toast('Результат одобрен. Выберите, куда опубликовать.')}
function editResult(){clearTimeout(publicationTimer);approved=false;published=false;sending=false;publicationError=false;renderPublication();document.querySelector('textarea').focus()}
function renderAccounts(){const host=document.getElementById('socialaccounts');if(!host)return;host.innerHTML=connected?'<div class="accountrow"><span class="avatar">'+icon('user')+'</span><div class="accountinfo"><h3>Личная страница</h3><p>@anna.beauty · Подключено</p></div><button type="button" class="textlink" onclick="disconnectSocial()">Отключить</button></div><button type="button" class="btn outline socialadd" onclick="toast(\'Выбор площадок будет доступен после подключения интеграций\')">Подключить ещё</button>':'<div class="socialempty"><p class="small muted">Пока нет подключённых страниц.</p><button type="button" class="btn outline" onclick="connectSocial()">Подключить соцсеть</button></div>'}
function connectSocial(){connected=true;renderAccounts();renderPublication();toast('Демонстрация подключения. Реальный аккаунт не привязан.')}
function disconnectSocial(){connected=false;renderAccounts();renderPublication()}
function renderPublication(){const host=document.getElementById('publication');if(!host)return;document.querySelectorAll('.approval').forEach(b=>{b.textContent=approved?'Результат одобрен':'Одобрить результат';b.disabled=approved});document.querySelectorAll('.editresult').forEach(b=>b.disabled=sending);document.querySelectorAll('.previewapprove').forEach(b=>b.hidden=approved);if(published){host.innerHTML='<div class="publishstatus" role="status">'+icon('check')+'Серия опубликована</div><p class="small muted">3 сторис · Личная страница @anna.beauty</p>';document.querySelector('.preview .caption').innerHTML='Серия сторис · Тихая ботаника<br>Опубликовано';return}document.querySelector('.preview .caption').innerHTML='Серия сторис · Тихая ботаника<br>Ещё не опубликовано';host.innerHTML='<h3>Публикация</h3>'+(connected?'<label class="field">Куда отправить<select aria-label="Аккаунт для публикации" '+(sending?'disabled':'')+'><option>Личная страница · @anna.beauty</option></select></label>':'<p class="small muted" style="margin:12px 0">Подключите страницу, чтобы отправить сторис.</p><button type="button" class="textlink small" onclick="connectSocial()">Подключить соцсеть</button><br><br>')+(publicationError?'<p class="small error" role="alert" style="margin-bottom:12px">Не удалось отправить сторис. Подключите страницу заново и повторите.</p><button class="textlink small" style="margin-bottom:12px" onclick="connectSocial();publicationError=false;renderPublication()">Подключить заново</button><br>':'')+'<button class="btn orange" onclick="publishResult()" '+(!approved||!connected||sending?'disabled':'')+'>'+(sending?'Публикуем…':publicationError?'Повторить публикацию':'Опубликовать')+'</button><p class="small muted" style="margin-top:9px">'+(approved?'Отправим всю серию в выбранный аккаунт.':'Сначала проверьте и одобрите результат.')+'</p>'}
function publishResult(){if(!approved||!connected||sending||published)return;sending=true;publicationError=false;renderPublication();publicationTimer=setTimeout(()=>{sending=false;if(demoPublicationError){publicationError=true}else{published=true}renderPublication();toast('Демонстрация: реальная публикация не выполнялась.')},1000)}

function filterThemes(button,recent){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b===button));document.querySelectorAll('.themegrid article').forEach((a,i)=>a.hidden=recent&&i>0)}
function selectSlide(button,i){document.querySelectorAll('.strip button').forEach(b=>b.classList.toggle('selected',b===button));document.querySelector('.story h2').innerHTML=['Бережно<br>к себе.<br>Каждый день.','Ваш<br>ежедневный<br>уход.','Остались<br>вопросы?'][i];document.querySelector('.previewhead span').textContent=`${i+1} из 3`}
document.getElementById('app').innerHTML=page==='login'||page==='register'?auth(page==='register'):page==='themes'?themes():page==='profile'?profile():workspace();
if(page==='profile')renderAccounts();
if(result){const dl=document.querySelector('.preview .btn');dl.insertAdjacentHTML('beforebegin','<button class="btn previewapprove" onclick="approve()">Одобрить результат</button>');renderPublication()}
if(q.get('panel')==='preview'&&page==='workspace')tab(true);
</script>
</html>
